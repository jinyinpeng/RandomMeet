<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>隐私说明 · RandomMeet</title><link rel="stylesheet" href="/styles.css"></head><body><header><a href="/">✦ RandomMeet</a></header><main><h1>隐私说明（测试版）</h1><p>本测试版使用浏览器请求你授权的摄像头和麦克风，并通过 WebRTC 尝试在用户设备之间建立连接。服务端转发连接协商信息，不主动录制媒体内容；但对方仍可能使用外部设备录制，且本项目尚未经过独立安全审计。</p><h2>当前数据处理</h2><p>匹配使用临时会话标识和所选聊天模式。当前版本没有账户系统、持久化资料、持久化屏蔽列表或数据删除门户。举报功能仅显示确认提示，不会保存或通知审核人员。</p><p>不要分享真实姓名、住址、证件号码、财务信息或其他敏感信息。公开上线前需要补齐正式隐私政策、联系渠道、数据保留与删除流程，并审查适用法律。</p><p><a href="/">返回首页</a></p></main></body></html>
